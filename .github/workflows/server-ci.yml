
name: Ktor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local properties
        run: echo "FOOTBALL_DATA_API_TOKEN=ci-placeholder" > local.properties

      - name: Run Ktor tests
        run: |
          bash ./gradlew :server:test \
            --tests "com.example.soccerapp.server.ApplicationTest" \
            --tests "com.example.soccerapp.server.CommentRoutesTest"
